name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          pkgs=./...
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows runs only the client; the build-side packages run on the Mac.
            pkgs=$(go list ./... | grep -vE '/internal/(store|queue|notify|server|xcode|pipeline|run|launchd)$')
          fi
          go test -race -shuffle=on $pkgs

      - name: Build and run
        shell: bash
        run: |
          go build -o "eve$(go env GOEXE)" ./cmd/eve
          "./eve$(go env GOEXE)" version
          "./eve$(go env GOEXE)" --help >/dev/null

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: gofumpt
        run: nix develop -c sh -c 'test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }'
      - name: golangci-lint (linux, darwin, windows)
        run: |
          for os in linux darwin windows; do
            GOOS=$os nix develop -c golangci-lint run ./...
          done

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#eve --print-build-logs
      - run: ./result/bin/eve version

  goreleaser:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,notarize
